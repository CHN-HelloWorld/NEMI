namespace=NEMIv1

; -------------------------------------------------------------------------
; Key Bindings - 快捷键配置
; -------------------------------------------------------------------------

; F6: 切换 Mod 显示开/关
[KeyToggleMods]
Key = no_modifiers F6
run = CommandListToggleMods

; Alt+F12: 切换兼容模式 (用于支持旧版 Mod API)
[KeyToggleCompatibilityMode]
key = ALT F12
run = CommandListToggleCompatibilityMode

; F12: 切换用户指南显示
[KeyToggleUserGuide]
key  = no_modifiers F12
type = cycle
$show_user_guide = 0,1

; Ctrl+F12: 切换捕获模式指南显示
[KeyToggleHuntingModeGuide]
key  = CTRL F12
type = cycle
$show_hunting_mode_guide = 0,1

; X 键 / 手柄 X: 隐藏版本不兼容通知
[KeyHideNotification]
key = X
key = XB_X
run = CommandListHideNotification