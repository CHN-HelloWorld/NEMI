namespace=NEMIv1
; NEMI-Utilities.ini
; 异环游戏状态检测工具
; 用途: 检测游戏内 UI 状态(角色菜单、换装界面等), 供 Mod 条件判断使用
;
; 使用方法:
;   在 Mod 的 ini 中通过命名空间访问状态变量:
;     if $\NEMIv1\in_character_menu  → 角色选择/画廊界面激活
;     if $\NEMIv1\in_costuming       → 换装界面激活
;
; 重要说明:
;   下方着色器哈希值需要通过 Hunting Mode 从游戏中提取。
;   方法:
;     1. 在 d3dx.ini 中将 hunting = 1 (或按小键盘0启用)
;     2. 进入目标界面 (如角色菜单 / 换装界面)
;     3. 依次循环 VS/PS (小键盘1-6) 找到绘制目标 UI 元素的着色器
;     4. 按对应的 mark 键 (3/6/9) 将哈希复制到剪贴板
;     5. 将哈希填入对应的 ShaderOverride 或 TextureOverride 块中


; -------------------------------------------------------------------------
; Resources
; -------------------------------------------------------------------------

[Constants]
global $in_character_menu = 0
global $in_costuming       = 0


; -------------------------------------------------------------------------
; Present - 每帧重置状态
; -------------------------------------------------------------------------

[Present]
post $in_character_menu = 0
post $in_costuming       = 0


; -------------------------------------------------------------------------
; 游戏状态检测 - 着色器哈希覆写
; 以下各节需要填入异环(Neverness To Everness)的具体着色器哈希值
; -------------------------------------------------------------------------

; 示例: 检测角色菜单背景粒子特效 VS
; 找到该着色器后取消注释并填入正确哈希
;
; [ShaderOverrideCharacterMenuBackgroundVS]
; hash = 0000000000000000      ← 通过 Hunting Mode 找到并填入
; allow_duplicate_hash = true
; $in_character_menu = 1


; 示例: 检测角色菜单 UI 绘制 PS
;
; [ShaderOverrideCharacterMenuUIPS]
; hash = 0000000000000000      ← 通过 Hunting Mode 找到并填入
; allow_duplicate_hash = true
; if $in_character_menu
;     checktextureoverride = ps-t0
; endif


; 示例: 通过纹理哈希检测换装界面激活
; 找到换装界面专属纹理后取消注释并填入正确哈希
;
; [TextureOverrideCostumingMenuTile]
; hash = 00000000              ← 通过 Hunting Mode 找到并填入 (8位纹理哈希)
; match_priority = 0
; $in_costuming = 1


; -------------------------------------------------------------------------
; 辅助命令列表
; -------------------------------------------------------------------------

; 空实现 - 抑制 VS 槽备份/恢复相关调用的错误
[CommandListBackupRestoreVertexTextureSlots]


; -------------------------------------------------------------------------
; API - 供 Mod 使用的游戏状态变量
; -------------------------------------------------------------------------

; 检测角色菜单(画廊)界面是否激活:
; if $\NEMIv1\in_character_menu
;     ~~~~
; endif

; 检测换装界面是否激活:
; if $\NEMIv1\in_costuming
;     ~~~~
; endif
