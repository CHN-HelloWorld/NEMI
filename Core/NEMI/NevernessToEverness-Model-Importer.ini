; -------------------------------------------------------------------------

; Includes

; -------------------------------------------------------------------------



[IncludeKeyBindings]

include = KeyBindings.ini



[IncludeUtilities]

include = NEMI-Utilities.ini





; -------------------------------------------------------------------------

; API - 供 Mod 调用的公共接口

; -------------------------------------------------------------------------



; 设置或覆写 Shape Key 的值

; 用法示例:

;   $\NEMIv1\shapekey_id    = 86

;   $\NEMIv1\shapekey_value  = 0.5

;   cs-u5 = ResourceCustomShapeKeyValuesRW

;   run = CommandList\NEMIv1\SetShapeKey

[CommandListSetShapeKey]

$shapekey_mode = 0

run = CustomShaderShapeKeySetter





; 禁用对某 Shape Key 原始值的覆写

; 用法示例:

;   $\NEMIv1\shapekey_id = 21

;   cs-u5 = ResourceCustomShapeKeyValuesRW

;   run = CommandList\NEMIv1\DisableShapeKeyOverride

[CommandListDisableShapeKeyOverride]

$shapekey_mode = 1

run = CustomShaderShapeKeySetter





; 使用提供的参数在屏幕上打印文字

; 用法示例:

;   Resource\NEMIv1\Text      = ref ResourceMyText

;   Resource\NEMIv1\TextParams = ref ResourceMyTextParams

;   run = CommandList\NEMIv1\PrintText

[CommandListPrintText]

run = CommandListRenderText





; 文字资源示例

[ResourceTextExample]

type = Buffer

data = "Hello from NEMI!"





; 文字文件资源示例

[ResourceTextFileExample]

type     = buffer

format   = R8_UINT

filename = MyText.txt





; 文字参数资源示例

[ResourceTextParamsExample]

type  = StructuredBuffer

array = 1

data  = R32_FLOAT  -0.25 +0.15 +0.25 -0.05   1.00 1.00 1.00 1.00   0.00 0.00 0.00 0.95   0.02  0.05   2 1   1   1.0

;                   x1-^  y1-^  x2-^  y2-^   | R-^  G-^  B-^  A-^  | R-^  G-^  B-^  A-^  | ^-H    V-^ | ^ ^ | ^-文字对齐: 0=左 1=居中 2=右 | ^-字体缩放

