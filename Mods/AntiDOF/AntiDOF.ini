; =============================================================================
; 异环 (Neverness To Everness) - 全角色通用反虚化
; NEMI Framework | Mods/AntiDOF/AntiDOF.ini
;
; ── 虚化触发与表现 ───────────────────────────────────────────────────────────
;   像素着色器会根据比较结果控制一段额外颜色叠加:
;     r0.w = dissolve_comparison_result  (0=未触发, 1=触发)
;     r2.xyz += cb2[6].xyz * r0.w
;   当 r0.w 为 1 时，会出现明显的虚化/泛白观感。
;   "反虚化" 的核心就是让这段叠加强度失效。
;
; ── 实现方案（当前项目状态）─────────────────────────────────────────────────
;     在 ShaderFixes/<hash>-ps_replace.txt 中注入:
;       if (IniParams[6].x > 0.5) r0.w = 0.0;
;     含义: 将触发权重强制清零，虚化叠加不再生效。
;
; 快捷键: F7 切换反虚化开/关（持久化保存）
; =============================================================================
namespace = NevernessToEvernessAntiFade
; ── 全局变量 ──────────────────────────────────────────────────────────────────
[Constants]
global persist $anti_fade_enabled = 1


; ── 每帧将开关状态写入 IniParams[6].x，供 HLSL 读取 ─────────────────────────
; x6 对应 IniParams[6].x（t120 寄存器）
; NEMI 框架仅使用 x0-x2 范围，x6 不会冲突
[Present]
x6 = $anti_fade_enabled


; ── 快捷键: F7 切换反虚化 ────────────────────────────────────────────────────
[KeyToggleAntiFade]
Key  = no_modifiers F7
type = cycle
$anti_fade_enabled = 0, 1

