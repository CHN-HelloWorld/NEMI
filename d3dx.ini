;------------------------------------------------------------------------------------------------------
; NEMI - Neverness To Everness (异环) Model Importer
; 专为异环(虚幻5引擎)定制的 3DMigoto Mod 加载器配置
; 基于 XXMI-Libs-Package (https://github.com/SpectrumQT/XXMI-Libs-Package) 的 d3d11.dll
; 注入器: 3DMigoto Loader.exe (https://github.com/bo3b/3Dmigoto)
; 使用方式: 先运行 3DMigoto Loader.exe, 再通过游戏官方启动器启动游戏触发注入
;------------------------------------------------------------------------------------------------------

;------------------------------------------------------------------------------------------------------
; [Loader] 块由外部 3DMigoto Loader.exe 使用
;------------------------------------------------------------------------------------------------------
[Loader]

; 目标进程(注入对象)
target = HTGame.exe

; 允许以下 .exe 载入 3DMigoto DLL
; 此处填写 3DMigoto Loader.exe 的文件名
loader = 3DMigoto Loader.exe

; 3DMigoto DLL 模块名称 (与 d3d11.dll 同目录)
module = d3d11.dll

; 若游戏以管理员权限运行，取消注释以下行
; require_admin = true

; 自动检测确认注入完成后额外等待的秒数
; 异环等多进程 UE5 游戏建议设为 -1 或适当正数
; delay = -1


;------------------------------------------------------------------------------------------------------
; [Include] - 附加配置文件与 Mod 目录
;------------------------------------------------------------------------------------------------------
[Include]

; 可取消注释启用调试器(查看 INI 变量和着色器缓冲区值)
;include = Core\Debugger\Debugger.ini

; NEMI 核心模块
include = Core\NEMI\NevernessToEverness-Model-Importer.ini
; 递归加载 Mods 文件夹中所有 .ini 文件
include_recursive = Mods

; 排除以 DISABLED 开头的文件夹(用于临时禁用某 Mod)
exclude_recursive = DISABLED*

; 排除 Windows 资源管理器生成的配置文件
exclude_recursive = desktop.ini


;------------------------------------------------------------------------------------------------------
; [Hunting] - Shader 捕获与调试选项
;------------------------------------------------------------------------------------------------------
[Hunting]

; 0 = 发布模式(禁用捕获, 性能最优)
; 1 = 捕获模式已启用
; 2 = 捕获模式"软禁用" - 可通过 toggle_hunting 键切换
hunting = 0

; 捕获期间 IB/VB buffer hash 在覆盖层中保留的帧数上限
overlay_buffer_hash_lifetime = 0

; 当前选中着色器/渲染目标的高亮模式
; "skip"     = 跳过着色器(不渲染)
; "original" = 如有补丁则回退到原始着色器
; "pink"     = 将输出染成粉色以便识别
marking_mode = skip

; 切换高亮模式快捷键 (小键盘点 + 小键盘0)
next_marking_mode = no_modifiers VK_DECIMAL VK_NUMPAD0

; 标记动作: 将哈希值复制到剪贴板，同时将反编译 HLSL 写入 ShaderFixes/<hash>_replace.hlsl
marking_actions = clipboard hlsl

; 循环浏览像素着色器
previous_pixelshader  = no_modifiers NO_VK_DECIMAL VK_NUMPAD1
next_pixelshader      = no_modifiers NO_VK_DECIMAL VK_NUMPAD2
mark_pixelshader      = no_modifiers NO_VK_DECIMAL VK_NUMPAD3

; 循环浏览顶点着色器
previous_vertexshader = no_modifiers NO_VK_DECIMAL VK_NUMPAD4
next_vertexshader     = no_modifiers NO_VK_DECIMAL VK_NUMPAD5
mark_vertexshader     = no_modifiers NO_VK_DECIMAL VK_NUMPAD6

; 循环浏览索引缓冲区
previous_indexbuffer  = no_modifiers NO_VK_DECIMAL VK_NUMPAD7
next_indexbuffer      = no_modifiers NO_VK_DECIMAL VK_NUMPAD8
mark_indexbuffer      = no_modifiers NO_VK_DECIMAL VK_NUMPAD9

; 循环浏览顶点缓冲区
previous_vertexbuffer      = no_modifiers NO_VK_DECIMAL NO_VK_RETURN VK_DIVIDE
next_vertexbuffer          = no_modifiers NO_VK_DECIMAL NO_VK_RETURN VK_MULTIPLY
mark_vertexbuffer          = no_modifiers NO_VK_DECIMAL VK_SUBTRACT
previous_vertexbuffer_slot = no_modifiers VK_RETURN VK_DIVIDE
next_vertexbuffer_slot     = no_modifiers VK_RETURN VK_MULTIPLY

; 循环浏览计算着色器
previous_computeshader = no_modifiers VK_DECIMAL VK_NUMPAD1
next_computeshader     = no_modifiers VK_DECIMAL VK_NUMPAD2
mark_computeshader     = no_modifiers VK_DECIMAL VK_NUMPAD3

; 循环浏览几何着色器
previous_geometryshader = no_modifiers VK_DECIMAL VK_NUMPAD4
next_geometryshader     = no_modifiers VK_DECIMAL VK_NUMPAD5
mark_geometryshader     = no_modifiers VK_DECIMAL VK_NUMPAD6

; 循环浏览域着色器
previous_domainshader = no_modifiers VK_DECIMAL VK_NUMPAD7
next_domainshader     = no_modifiers VK_DECIMAL VK_NUMPAD8
mark_domainshader     = no_modifiers VK_DECIMAL VK_NUMPAD9

; 循环浏览壳着色器
previous_hullshader = no_modifiers VK_DECIMAL VK_DIVIDE
next_hullshader     = no_modifiers VK_DECIMAL VK_MULTIPLY
mark_hullshader     = no_modifiers VK_DECIMAL VK_SUBTRACT

; 完成捕获后重新启用所有着色器
done_hunting = NO_MODIFIERS NO_VK_DECIMAL VK_ADD

; 截图 (PNG)
take_screenshot = no_modifiers VK_SNAPSHOT

; 重新加载 ShaderFixes 文件夹中的所有修复
reload_fixes = no_modifiers VK_F10

; 切换捕获模式开/关 (同时显示/隐藏叠加层)
toggle_hunting = no_modifiers NO_VK_DECIMAL VK_NUMPAD0

; 不重启游戏直接重新加载 d3dx.ini 设置
reload_config = no_modifiers VK_F10

; 删除 d3dx_user.ini 并重置设置 (Ctrl+Alt+F10)
wipe_user_config = ctrl alt no_shift VK_F10

; 按住此键暂时禁用 NEMI - 可用于对比原始效果
show_original = no_modifiers VK_F9

; 显示每个活动命令列表的 CPU 利用率和性能影响
monitor_performance = ctrl no_shift no_alt F9

; 冻结当前性能监视器显示并记录到 d3d11_log.txt
freeze_performance_monitor = no_ctrl shift no_alt F9

; 自动重复按键速率 (每秒事件数)
repeat_rate = 6

; 捕获期间在叠加层显示当前选中着色器和索引缓冲区的哈希值
verbose_overlay = 1

; 帧分析 (下一帧转储 DirectX 状态更改和渲染目标内容)
analyse_frame = no_modifiers VK_F8

; 帧分析选项
analyse_options = dump_rt dump_tex dump_cb dump_vb dump_ib buf txt


;------------------------------------------------------------------------------------------------------
; [Constants] - 全局 INI 变量初始化
;------------------------------------------------------------------------------------------------------
[Constants]
; 在此声明命名全局变量，供命令列表、[Key] 绑定和 [Preset] 使用
; 示例: global $my_variable = 0.0
; 示例(持久化): global persist $my_persist_var = 1


;------------------------------------------------------------------------------------------------------
; [System] - 系统与 DLL 链加载配置
;------------------------------------------------------------------------------------------------------
[System]

; 监视器分辨率 (自动检测失败时的后备值)
screen_width  = 1920
screen_height = 1080

; DLL 初始化延迟 (毫秒)
; 异环 UE5: 推荐 500ms 以避免启动崩溃
; 若需同时注入 ReShade, 建议使用 500ms 或以上
dll_initialization_delay = 500

; load_library_redirect:
;   0 = 关闭, 允许所有调用不做修改直接通过
;   1 = 仅强制 nvapi.dll 重定向到游戏文件夹
;   2 = 同时强制 d3d11.dll 和 nvapi.dll 重定向到游戏文件夹
load_library_redirect = 2

; 仅在游戏处于前台时处理按键输入
check_foreground_window = 1

; D3D11 设备创建兼容性
allow_check_interface = 1
allow_create_device   = 1
allow_platform_update = 1

; 跳过 DLL 初始化阶段的 [Include] 加载 (对大量 Mod 配置有效)
; 1 = 延迟到首帧后加载 (推荐)
; 0 = 配合 config_initialization_delay=-1 还原原始行为
skip_early_includes_load = 1

; 游戏启动后首次配置重新加载的延迟(秒)
; 0  = 延迟到首帧
; -1 = 禁用
config_initialization_delay = 0

; 持久变量自动保存到 d3dx_user.ini 的间隔(秒)
; -1 = 禁用
settings_auto_save_interval = 60


;------------------------------------------------------------------------------------------------------
; [Device] - 显示设备与分辨率设置
;------------------------------------------------------------------------------------------------------
[Device]

; 上缩放模式
;   0 = 禁用上缩放
;   1 = 启用上缩放, 允许游戏切换全屏模式
;   2 = 启用上缩放, 强制全屏模式
upscaling = 0

; 全屏模式
;   0 = 窗口模式
;   1 = 尝试强制独占全屏
full_screen = 0

; 从交换链获取分辨率用于纹理哈希
get_resolution_from = swap_chain

; 硬件鼠标光标: 0=显示, 1=隐藏
hide_cursor = 0


;------------------------------------------------------------------------------------------------------
; [Rendering] - GPU 程序操控与渲染设置
;------------------------------------------------------------------------------------------------------
[Rendering]

; 着色器哈希算法: 3dmigoto / embedded / bytecode
shader_hash = 3dmigoto

; 使用新版纹理哈希 (不易发生碰撞)
texture_hash = 1

; 自定义着色器目录
override_directory = ShaderFixes

; 已编译着色器缓存目录
cache_directory = ShaderCache

; 游戏直接编译的着色器存放目录
storage_directory = ShaderFromGame

; 缓存所有编译后的 .txt 着色器为 .bin 格式 (减少加载延迟)
cache_shaders = 0

; 光栅化剪裁: 0=默认启用, 1=禁用
rasterizer_disable_scissor = 0

; 跟踪纹理更新以确保哈希与内容同步
track_texture_updates = 1

; 当游戏跨多个绘制调用重用索引缓冲区但不重新绑定时, 自动记住上次绑定的 IB
track_implicit_index_buffers = 0

; 基于实际使用的缓冲区区域进行哈希
track_region_hashes = 0

; 允许 TextureOverride 中的缓冲区大小调整 (顶点数量限制突破)
allow_buffer_resize = 1

; IniParams 纹理分配的寄存器槽 (-1=禁用)
ini_params = 120

; 在着色器汇编中启用输入/输出/补丁常量签名注释
assemble_signature_comments = 1

; 在反汇编着色器时包含原始"不可解析自定义数据"
disassemble_undecipherable_custom_data = 1

; 将 CB 偏移替换为索引和组件注释
patch_assembly_cb_offsets = 1

; 子目录中 HLSL #include 使用更合理的路径解析
recursive_include = 1


;------------------------------------------------------------------------------------------------------
; [Logging] - 日志选项
;------------------------------------------------------------------------------------------------------
[Logging]

; 记录所有 API 调用
calls = 0

; 记录按键输入动作
input = 0

; 超级详细日志
debug = 0

; 非缓冲日志
unbuffered = 0

; 强制单 CPU 核心调试
force_cpu_affinity = 0

; 死锁检测
debug_locks = 0

; 崩溃处理器 (生成 minidump)
crash = 0

; 显示 INI 解析警告并发出蜂鸣声
show_warnings = 0


;------------------------------------------------------------------------------------------------------
; [CommandListUnbindAllRenderTargets] - 内置快捷命令:解绑全部渲染目标
;------------------------------------------------------------------------------------------------------
[CommandListUnbindAllRenderTargets]
run = BuiltInCommandListUnbindAllRenderTargets


;------------------------------------------------------------------------------------------------------
; [Present] - 每帧执行的命令
;------------------------------------------------------------------------------------------------------
[Present]
; 示例: 每帧开始时清除 ini 参数
;post x = 0
